<!doctype html>
<html lang="en">
<head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DealWorld 2.0</title>
<style>
  :root{
    --bg: #15181C;
    --panel: #1B2026;
    --panel-2: #20262D;
    --line: #2B323B;
    --ink: #ECE8DF;
    --muted: #8B93A0;
    --brass: #C9962F;
    --brass-dim: #8A6A24;
    --teal: #3E8E8A;
    --teal-dim: #2B6663;
    --red: #C1584B;
    --green: #5FA37A;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{ box-sizing: border-box; }
  body{ margin:0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  #app{ min-height: 100vh; }

  /* ---- Top bar ---- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 22px; border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top:0; z-index:20;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand .mark{ font-family: var(--serif); font-size: 22px; letter-spacing: 0.5px; color: var(--ink); }
  .brand .mark b{ color: var(--brass); font-weight:700; }
  .brand .tag{ font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  nav.tabs{ display:flex; gap: 4px; }
  nav.tabs button{
    background:transparent; border:1px solid transparent; color: var(--muted);
    font-family: var(--sans); font-size: 13px; padding: 8px 14px; border-radius: 6px; cursor:pointer;
  }
  nav.tabs button.active{ color: var(--ink); background: var(--panel-2); border-color: var(--line); }
  nav.tabs button:hover{ color: var(--ink); }

  .wrap{ max-width: 1240px; margin: 0 auto; padding: 26px 22px 60px; }
  h1.page-title{ font-family: var(--serif); font-size: 26px; margin: 0 0 4px; }
  p.page-sub{ color: var(--muted); font-size: 13px; margin: 0 0 22px; }

  /* ---- Dashboard ---- */
  .grid-3{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 22px; }
  .stat{ background: var(--panel); border:1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .stat .n{ font-family: var(--mono); font-size: 28px; color: var(--brass); }
  .stat .l{ font-size: 12px; color: var(--muted); margin-top: 4px; }
  .panel{ background: var(--panel); border:1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 18px; }
  .panel h3{ font-size: 13px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  .row-item{ display:flex; align-items:center; justify-content:space-between; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .row-item:last-child{ border-bottom:none; }
  .pill{ font-family: var(--mono); font-size: 10.5px; padding: 2px 8px; border-radius: 20px; border:1px solid var(--line); color: var(--muted); }
  .pill.warn{ color:#E2B857; border-color:#4a3d1c; background:#2a2413; }
  .pill.late{ color: var(--red); border-color:#4a2620; background:#2a1815; }
  .empty{ color: var(--muted); font-size:13px; padding: 6px 0; }

  /* ---- Buttons ---- */
  .btn{
    font-family: var(--sans); font-size: 13px; padding: 8px 14px; border-radius: 7px; cursor:pointer;
    border:1px solid var(--line); background: var(--panel-2); color: var(--ink);
  }
  .btn:hover{ border-color:#3a4351; }
  .btn.primary{ background: var(--brass); border-color: var(--brass); color: #1A1508; font-weight:600; }
  .btn.primary:hover{ filter: brightness(1.08); }
  .btn.ghost{ background: transparent; }
  .btn.small{ padding: 5px 10px; font-size: 12px; }
  .btn.danger{ color: var(--red); }

  /* ---- Pipeline ---- */
  .pipe-controls{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 16px; }
  .toggle{ display:flex; background: var(--panel); border:1px solid var(--line); border-radius: 8px; overflow:hidden; }
  .toggle button{ background:transparent; border:none; color: var(--muted); padding: 8px 18px; font-size:13px; cursor:pointer; font-family: var(--sans); }
  .toggle button.active.buyer{ background: var(--teal-dim); color:#DCEEEC; }
  .toggle button.active.seller{ background: var(--brass-dim); color:#F5E6C6; }

  .board{ display:flex; gap: 14px; overflow-x: auto; padding-bottom: 10px; }
  .col{ min-width: 220px; max-width: 220px; flex-shrink:0; }
  .col-head{ font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; padding: 0 2px 8px; display:flex; justify-content:space-between; }
  .col-body{ display:flex; flex-direction:column; gap: 8px; min-height: 40px; }
  .card{
    background: var(--panel); border:1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor:pointer;
    border-left: 3px solid var(--muted); position:relative;
  }
  .card.buyer{ border-left-color: var(--teal); }
  .card.seller{ border-left-color: var(--brass); }
  .card:hover{ border-color:#3a4351; }
  .card{ touch-action: none; }
  .card.dragging{ opacity: 0.35; }
  .drag-ghost{ position: fixed; z-index: 999; pointer-events: none; opacity: 0.92; transform: rotate(-2deg); box-shadow: 0 10px 28px rgba(0,0,0,0.45); }
  .col-body.drag-over{ background: rgba(201,150,47,0.08); outline: 1.5px dashed var(--brass); outline-offset: -1px; border-radius: 8px; }
  .card .nm{ font-size: 13.5px; font-weight:600; margin-bottom: 3px; }
  .card .meta{ font-size: 11px; color: var(--muted); }
  .card .tsk{ margin-top:6px; font-size:10.5px; color:#E2B857; font-family: var(--mono); }

  /* ---- Tables ---- */
  table{ width:100%; border-collapse: collapse; font-size: 13.5px; }
  th{ text-align:left; color: var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.4px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td{ padding: 10px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:hover td{ background: var(--panel-2); }
  .avatar{ width: 30px; height:30px; border-radius: 50%; object-fit: cover; background: var(--panel-2); border:1px solid var(--line); display:inline-block; vertical-align:middle; }
  .tagchip{ display:inline-block; font-family: var(--mono); font-size: 10px; padding: 2px 7px; border-radius: 10px; background: var(--panel-2); border:1px solid var(--line); color: var(--muted); margin: 2px 4px 0 0; }

  /* ---- Forms ---- */
  .field{ margin-bottom: 12px; }
  .field label{ display:block; font-size: 11.5px; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px; }
  .field input, .field select, .field textarea{
    width:100%; background: var(--panel-2); border:1px solid var(--line); border-radius: 6px; color: var(--ink);
    padding: 8px 10px; font-family: var(--sans); font-size: 13.5px;
  }
  .field textarea{ min-height: 70px; resize: vertical; }
  .form-2col{ display:grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }

  /* ---- Modal / Drawer ---- */
  .scrim{ position:fixed; inset:0; background: rgba(10,12,14,0.6); z-index: 50; display:flex; justify-content:flex-end; }
  .drawer{ width: 460px; max-width: 92vw; background: var(--bg); border-left: 1px solid var(--line); height: 100%; overflow-y:auto; padding: 22px; }
  .modal-card{ margin:auto; width: 480px; max-width: 92vw; background: var(--bg); border:1px solid var(--line); border-radius: 12px; padding: 22px; max-height: 88vh; overflow-y:auto; }
  .drawer-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 14px; }
  .drawer-head h2{ font-family: var(--serif); font-size: 20px; margin:0 0 4px; }
  .close-x{ background:none; border:none; color: var(--muted); font-size: 18px; cursor:pointer; }
  .stage-select{ margin-bottom: 16px; }
  .section-label{ font-size: 12px; text-transform:uppercase; letter-spacing:0.5px; color: var(--muted); margin: 18px 0 8px; font-weight:600; }
  .note-item, .task-item{ background: var(--panel); border:1px solid var(--line); border-radius: 7px; padding: 8px 10px; margin-bottom: 7px; font-size: 13px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .note-item .meta, .task-item .meta{ color: var(--muted); font-size: 10.5px; margin-top: 3px; font-family: var(--mono); }
  .task-item{ align-items:center; }
  .task-item.done{ opacity: 0.5; text-decoration: line-through; }
  .item-actions{ display:flex; gap:4px; align-items:center; flex-shrink:0; }
  .mini-x{ background:none; border:none; color: var(--muted); cursor:pointer; font-size:14px; line-height:1; padding: 2px 4px; }
  .mini-x:hover{ color: var(--red); }
  .inline-add{ display:flex; gap: 6px; margin-bottom: 10px; }
  .inline-add input, .inline-add textarea{ flex:1; background: var(--panel-2); border:1px solid var(--line); border-radius:6px; color: var(--ink); padding: 7px 9px; font-size: 13px; }

  .stamp{
    display:inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: 1px; text-transform:uppercase;
    padding: 3px 9px; border: 1px solid; border-radius: 3px; transform: rotate(-2deg);
  }
  .stamp.won{ color: var(--green); border-color: var(--green); }
  .stamp.lost{ color: var(--red); border-color: var(--red); }

  .banner-empty{ text-align:center; padding: 50px 20px; color: var(--muted); }
  .banner-empty .big{ font-family: var(--serif); font-size: 18px; color: var(--ink); margin-bottom: 6px; }

  ::-webkit-scrollbar{ width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 6px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){

/* ---------------- DATA LAYER ---------------- */
let state = {
  leads: [],
  listings: [],
  contacts: [],
  provisors: [],
  newsletters: [],
  tasks: [], // every lead/contact task, flat — kept in sync so dashboard/pipeline/tasks views don't need each lead's detail loaded
  loaded: false
};

/* ---- API client ---- */
async function api(method, path, body){
  const res = await fetch("/api" + path, {
    method,
    credentials: "same-origin",
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined
  });
  if(res.status === 401){
    let msg = "not authenticated";
    try{ msg = (await res.json()).error || msg; }catch(e){}
    // Callers on the login/setup screen handle this themselves (wrong password, etc).
    // Anywhere else, a 401 means the session died mid-use — drop back to the login screen.
    if(authed){ authed = false; render(); }
    throw new Error(msg);
  }
  if(!res.ok){
    let msg = res.statusText;
    try{ msg = (await res.json()).error || msg; }catch(e){}
    alert("Something went wrong talking to the server: " + msg);
    throw new Error(msg);
  }
  if(res.status === 204) return null;
  return res.json();
}
const apiGet = (path)=> api("GET", path);
const apiPost = (path, body)=> api("POST", path, body);
const apiPatch = (path, body)=> api("PATCH", path, body);
const apiDelete = (path)=> api("DELETE", path);

function d(dateVal){ return dateVal ? String(dateVal).slice(0,10) : ""; }

/* ---- Server row -> frontend shape adapters ---- */
function normalizeNote(row){
  return { id: row.id, text: row.body, author: row.author || "Max", ts: d(row.created_at) };
}
function normalizeTask(row){
  return { id: row.id, title: row.title, due: d(row.due_date), status: row.status, assignee: row.assignee || "Max",
    leadName: row.lead_name, recordType: row.record_type, recordId: row.record_id };
}
function leadOpenTaskCount(leadId){
  return state.tasks.filter(t=>t.recordType==="lead" && t.recordId===leadId && t.status==="open").length;
}
function normalizeLead(row){
  return {
    id: row.id, name: row.name, email: row.email || "", phone: row.phone || "",
    type: row.type, source: row.source || "", listingRef: row.listing_ref || "", listingId: row.listing_id || "",
    stage: row.stage, outcome: row.outcome || null, owner: row.owner || "Max",
    lastContactAt: d(row.last_contact_at), createdAt: d(row.created_at), description: row.description || "",
    notes: (row.notes || []).map(normalizeNote),
    tasks: (row.tasks || []).map(normalizeTask),
    documents: row.documents || []
  };
}
function normalizeListing(row){
  return {
    id: row.id, businessName: row.business_name, industry: row.industry || "", askingPrice: row.asking_price || "",
    status: row.status, sellerLeadId: row.seller_lead_id || "", notes: row.notes || "", createdAt: d(row.created_at),
    links: (row.links || []).map(l=>({ id: l.id, label: l.label, url: l.url }))
  };
}
function normalizeContact(row){
  return {
    id: row.id, name: row.name, email: row.email || "", phone: row.phone || "", details: row.details || "",
    linkedin: row.linkedin || "", category: row.category || "General", tags: [row.category || "General"],
    photoDataUrl: row.photo_url || "", createdAt: d(row.created_at),
    notes: (row.notes || []).map(normalizeNote), tasks: (row.tasks || []).map(normalizeTask)
  };
}
function normalizeProvisor(row){
  return {
    id: row.id, name: row.name, email: row.email || "", phone: row.phone || "", specialty: row.specialty || "",
    tags: row.tags || [], photoDataUrl: row.photo_url || "",
    troikaCount: row.troika_count !== undefined ? Number(row.troika_count) : (row.troikas || []).length,
    connectionCount: row.connection_count !== undefined ? Number(row.connection_count) : (row.connections || []).length,
    commentCount: row.comment_count !== undefined ? Number(row.comment_count) : (row.comments || []).length,
    troikas: (row.troikas || []).map(t=>({ id: t.id, date: d(t.event_date), notes: t.notes })),
    connections: (row.connections || []).map(c=>({ id: c.id, date: d(c.event_date), direction: c.direction, note: c.note, linkedLeadId: c.linked_lead_id || "" })),
    comments: (row.comments || []).map(normalizeNote)
  };
}
function normalizeNewsletter(row){
  const opt = recipientOptions().find(g=>g.key===row.recipient_group);
  return {
    id: row.id, subject: row.subject || "", body: row.body || "", recipientKey: row.recipient_group,
    recipientLabel: opt ? opt.label : (row.recipient_group || "—"), status: row.status, createdAt: d(row.created_at)
  };
}

function md5(string) {
  function rotateLeft(x, c) { return (x << c) | (x >>> (32 - c)); }
  function addUnsigned(x, y) {
    const x4 = (x & 0x40000000), y4 = (y & 0x40000000);
    const x8 = (x & 0x80000000), y8 = (y & 0x80000000);
    const result = (x & 0x3FFFFFFF) + (y & 0x3FFFFFFF);
    if (x4 & y4) return (result ^ 0x80000000 ^ x8 ^ y8);
    if (x4 | y4) {
      if (result & 0x40000000) return (result ^ 0xC0000000 ^ x8 ^ y8);
      else return (result ^ 0x40000000 ^ x8 ^ y8);
    } else return (result ^ x8 ^ y8);
  }
  function F(x,y,z){ return (x & y) | ((~x) & z); }
  function G(x,y,z){ return (x & z) | (y & (~z)); }
  function H(x,y,z){ return (x ^ y ^ z); }
  function I(x,y,z){ return (y ^ (x | (~z))); }
  function FF(a,b,c,d,x,s,ac){ a=addUnsigned(a,addUnsigned(addUnsigned(F(b,c,d),x),ac)); return addUnsigned(rotateLeft(a,s),b); }
  function GG(a,b,c,d,x,s,ac){ a=addUnsigned(a,addUnsigned(addUnsigned(G(b,c,d),x),ac)); return addUnsigned(rotateLeft(a,s),b); }
  function HH(a,b,c,d,x,s,ac){ a=addUnsigned(a,addUnsigned(addUnsigned(H(b,c,d),x),ac)); return addUnsigned(rotateLeft(a,s),b); }
  function II(a,b,c,d,x,s,ac){ a=addUnsigned(a,addUnsigned(addUnsigned(I(b,c,d),x),ac)); return addUnsigned(rotateLeft(a,s),b); }
  function convertToWordArray(string) {
    let lWordCount;
    const lMessageLength = string.length;
    const lNumberOfWordsTemp1 = lMessageLength + 8;
    const lNumberOfWordsTemp2 = (lNumberOfWordsTemp1 - (lNumberOfWordsTemp1 % 64)) / 64;
    const lNumberOfWords = (lNumberOfWordsTemp2 + 1) * 16;
    const lWordArray = new Array(lNumberOfWords - 1);
    let lBytePosition = 0, lByteCount = 0;
    while (lByteCount < lMessageLength) {
      lWordCount = (lByteCount - (lByteCount % 4)) / 4;
      lBytePosition = (lByteCount % 4) * 8;
      lWordArray[lWordCount] = (lWordArray[lWordCount] || 0) | (string.charCodeAt(lByteCount) << lBytePosition);
      lByteCount++;
    }
    lWordCount = (lByteCount - (lByteCount % 4)) / 4;
    lBytePosition = (lByteCount % 4) * 8;
    lWordArray[lWordCount] = (lWordArray[lWordCount] || 0) | (0x80 << lBytePosition);
    lWordArray[lNumberOfWords - 2] = lMessageLength << 3;
    lWordArray[lNumberOfWords - 1] = lMessageLength >>> 29;
    return lWordArray;
  }
  function wordToHex(lValue) {
    let WordToHexValue = "", WordToHexValueTemp = "", lByte, lCount;
    for (lCount = 0; lCount <= 3; lCount++) {
      lByte = (lValue >>> (lCount * 8)) & 255;
      WordToHexValueTemp = "0" + lByte.toString(16);
      WordToHexValue += WordToHexValueTemp.substr(WordToHexValueTemp.length - 2, 2);
    }
    return WordToHexValue;
  }
  function utf8Encode(string) { return unescape(encodeURIComponent(string)); }

  string = utf8Encode(string);
  const x = convertToWordArray(string);
  let a = 0x67452301, b = 0xEFCDAB89, c = 0x98BADCFE, d = 0x10325476;
  const S11=7,S12=12,S13=17,S14=22,S21=5,S22=9,S23=14,S24=20,S31=4,S32=11,S33=16,S34=23,S41=6,S42=10,S43=15,S44=21;

  for (let k = 0; k < x.length; k += 16) {
    const AA=a, BB=b, CC=c, DD=d;
    a=FF(a,b,c,d,x[k+0],S11,0xD76AA478); d=FF(d,a,b,c,x[k+1],S12,0xE8C7B756); c=FF(c,d,a,b,x[k+2],S13,0x242070DB); b=FF(b,c,d,a,x[k+3],S14,0xC1BDCEEE);
    a=FF(a,b,c,d,x[k+4],S11,0xF57C0FAF); d=FF(d,a,b,c,x[k+5],S12,0x4787C62A); c=FF(c,d,a,b,x[k+6],S13,0xA8304613); b=FF(b,c,d,a,x[k+7],S14,0xFD469501);
    a=FF(a,b,c,d,x[k+8],S11,0x698098D8); d=FF(d,a,b,c,x[k+9],S12,0x8B44F7AF); c=FF(c,d,a,b,x[k+10],S13,0xFFFF5BB1); b=FF(b,c,d,a,x[k+11],S14,0x895CD7BE);
    a=FF(a,b,c,d,x[k+12],S11,0x6B901122); d=FF(d,a,b,c,x[k+13],S12,0xFD987193); c=FF(c,d,a,b,x[k+14],S13,0xA679438E); b=FF(b,c,d,a,x[k+15],S14,0x49B40821);
    a=GG(a,b,c,d,x[k+1],S21,0xF61E2562); d=GG(d,a,b,c,x[k+6],S22,0xC040B340); c=GG(c,d,a,b,x[k+11],S23,0x265E5A51); b=GG(b,c,d,a,x[k+0],S24,0xE9B6C7AA);
    a=GG(a,b,c,d,x[k+5],S21,0xD62F105D); d=GG(d,a,b,c,x[k+10],S22,0x2441453);  c=GG(c,d,a,b,x[k+15],S23,0xD8A1E681); b=GG(b,c,d,a,x[k+4],S24,0xE7D3FBC8);
    a=GG(a,b,c,d,x[k+9],S21,0x21E1CDE6); d=GG(d,a,b,c,x[k+14],S22,0xC33707D6); c=GG(c,d,a,b,x[k+3],S23,0xF4D50D87); b=GG(b,c,d,a,x[k+8],S24,0x455A14ED);
    a=GG(a,b,c,d,x[k+13],S21,0xA9E3E905); d=GG(d,a,b,c,x[k+2],S22,0xFCEFA3F8); c=GG(c,d,a,b,x[k+7],S23,0x676F02D9); b=GG(b,c,d,a,x[k+12],S24,0x8D2A4C8A);
    a=HH(a,b,c,d,x[k+5],S31,0xFFFA3942); d=HH(d,a,b,c,x[k+8],S32,0x8771F681); c=HH(c,d,a,b,x[k+11],S33,0x6D9D6122); b=HH(b,c,d,a,x[k+14],S34,0xFDE5380C);
    a=HH(a,b,c,d,x[k+1],S31,0xA4BEEA44); d=HH(d,a,b,c,x[k+4],S32,0x4BDECFA9); c=HH(c,d,a,b,x[k+7],S33,0xF6BB4B60); b=HH(b,c,d,a,x[k+10],S34,0xBEBFBC70);
    a=HH(a,b,c,d,x[k+13],S31,0x289B7EC6); d=HH(d,a,b,c,x[k+0],S32,0xEAA127FA); c=HH(c,d,a,b,x[k+3],S33,0xD4EF3085); b=HH(b,c,d,a,x[k+6],S34,0x4881D05);
    a=HH(a,b,c,d,x[k+9],S31,0xD9D4D039); d=HH(d,a,b,c,x[k+12],S32,0xE6DB99E5); c=HH(c,d,a,b,x[k+15],S33,0x1FA27CF8); b=HH(b,c,d,a,x[k+2],S34,0xC4AC5665);
    a=II(a,b,c,d,x[k+0],S41,0xF4292244); d=II(d,a,b,c,x[k+7],S42,0x432AFF97); c=II(c,d,a,b,x[k+14],S43,0xAB9423A7); b=II(b,c,d,a,x[k+5],S44,0xFC93A039);
    a=II(a,b,c,d,x[k+12],S41,0x655B59C3); d=II(d,a,b,c,x[k+3],S42,0x8F0CCC92); c=II(c,d,a,b,x[k+10],S43,0xFFEFF47D); b=II(b,c,d,a,x[k+1],S44,0x85845DD1);
    a=II(a,b,c,d,x[k+8],S41,0x6FA87E4F); d=II(d,a,b,c,x[k+15],S42,0xFE2CE6E0); c=II(c,d,a,b,x[k+6],S43,0xA3014314); b=II(b,c,d,a,x[k+13],S44,0x4E0811A1);
    a=II(a,b,c,d,x[k+4],S41,0xF7537E82); d=II(d,a,b,c,x[k+11],S42,0xBD3AF235); c=II(c,d,a,b,x[k+2],S43,0x2AD7D2BB); b=II(b,c,d,a,x[k+9],S44,0xEB86D391);
    a=addUnsigned(a,AA); b=addUnsigned(b,BB); c=addUnsigned(c,CC); d=addUnsigned(d,DD);
  }
  return (wordToHex(a)+wordToHex(b)+wordToHex(c)+wordToHex(d)).toLowerCase();
}


function gravatarUrl(email){
  if(!email || !email.includes("@")) return "";
  const hash = md5(email.trim().toLowerCase());
  return `https://www.gravatar.com/avatar/${hash}?s=160&d=404`;
}
function renderAvatar(photoDataUrl, email){
  if(photoDataUrl) return `<img class="avatar" src="${photoDataUrl}">`;
  const gUrl = gravatarUrl(email);
  if(gUrl) return `<img class="avatar" src="${gUrl}" onerror="this.outerHTML='<div class=\'avatar\'></div>'">`;
  return `<div class="avatar"></div>`;
}

function today(){ return new Date().toISOString().slice(0,10); }
function daysSince(dateStr){
  if(!dateStr) return 9999;
  return Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
}
function fmtDate(d){ if(!d) return "—"; return d; }

async function loadState(){
  try{
    const [leads, listings, contacts, provisors, newsletters, tasks] = await Promise.all([
      apiGet("/leads"), apiGet("/listings"), apiGet("/contacts"), apiGet("/provisors"), apiGet("/newsletters"), apiGet("/tasks")
    ]);
    state.leads = leads.map(normalizeLead);
    state.listings = listings.map(normalizeListing);
    state.contacts = contacts.map(normalizeContact);
    state.provisors = provisors.map(normalizeProvisor);
    state.newsletters = newsletters.map(normalizeNewsletter);
    state.tasks = tasks.map(normalizeTask);
  }catch(e){
    console.error("Failed to load from server", e);
  }
  state.loaded = true;
}

function normalizeHeader(h){ return String(h).toLowerCase().trim().replace(/[_\-]+/g," ").replace(/\s+/g," "); }

function autoMapHeaders(headers, fields){
  const mapping = {};
  fields.forEach(f=>{
    const match = headers.find(h=>{
      const nh = normalizeHeader(h);
      return f.synonyms.some(s=> nh===s || nh.includes(s));
    });
    mapping[f.key] = match || "";
  });
  return mapping;
}

// Builds a payload shaped for the backend's /import/* routes (snake_case, no client-only fields).
function buildRecordFromRow(module, row, mapping){
  const get = (key)=> mapping[key] ? String(row[mapping[key]] ?? "").trim() : "";
  if(module==="leads-buyer" || module==="leads-seller"){
    return {
      name: get("name"), email: get("email"), phone: get("phone"),
      source: get("source") || "CSV/Excel import", listing_ref: get("listingRef"),
      description: get("description")
    };
  }
  if(module==="listings"){
    return { business_name: get("businessName"), industry: get("industry"), asking_price: get("askingPrice"),
      status: get("status") || "Active", notes: get("notes") };
  }
  if(module==="contacts"){
    const details = get("details");
    return { name: get("name"), email: get("email"), phone: get("phone"), details,
      linkedin: get("linkedin"), category: autoCategory(details) };
  }
  if(module==="provisors"){
    return { name: get("name"), email: get("email"), phone: get("phone"), specialty: get("specialty") || "Other" };
  }
}

function recordHasAName(module, rec){
  return module==="listings" ? !!rec.business_name : !!rec.name;

/* ---------------- DASHBOARD ---------------- */
function renderDashboard(){
  const openLeads = state.leads.filter(l=>!l.stage.startsWith("Closed"));
  const openTasks = state.tasks
    .filter(t=>t.recordType==="lead" && t.status==="open")
    .map(t=>({...t, leadName: t.leadName || (state.leads.find(l=>l.id===t.recordId)||{}).name || "—", leadId: t.recordId}));
  openTasks.sort((a,b)=> (a.due||"").localeCompare(b.due||""));

  const goneQuiet = openLeads.filter(l=>{
    const limit = l.type==="buyer" ? 7 : 14;
    return daysSince(l.lastContactAt) > limit;
  }).sort((a,b)=> daysSince(b.lastContactAt)-daysSince(a.lastContactAt));

  const overdue = openTasks.filter(t=> t.due && t.due < today());

  return `
    <h1 class="page-title">Dashboard</h1>
    <p class="page-sub">${today()} · your morning read on the whole pipeline</p>

    <div class="grid-3">
      <div class="stat"><div class="n">${openLeads.length}</div><div class="l">Open leads and listings</div></div>
      <div class="stat"><div class="n">${openTasks.length}</div><div class="l">Open tasks</div></div>
      <div class="stat"><div class="n">${goneQuiet.length}</div><div class="l">Gone quiet — needs a touch</div></div>
    </div>

    <div class="panel">
      <h3>Gone Quiet</h3>
      ${goneQuiet.length ? goneQuiet.map(l=>`
        <div class="row-item">
          <span>${l.name} <span style="color:var(--muted)">— ${l.type==='buyer'?'buyer':'seller'} · ${l.stage}</span></span>
          <span class="pill ${daysSince(l.lastContactAt)>14?'late':'warn'}">${daysSince(l.lastContactAt)} days quiet</span>
        </div>`).join("") : `<div class="empty">Nobody has gone quiet. Everyone open has heard from you recently.</div>`}
    </div>

    <div class="panel">
      <h3>Tasks Due</h3>
      ${overdue.length ? overdue.map(t=>`
        <div class="row-item">
          <span>${t.title} <span style="color:var(--muted)">— ${t.leadName}</span></span>
          <span class="pill late">due ${t.due}</span>
        </div>`).join("") : `<div class="empty">Nothing overdue right now.</div>`}
    </div>

    <div class="panel">
      <h3>Recently Added</h3>
      ${state.leads.slice(-5).reverse().map(l=>`
        <div class="row-item">
          <span>${l.name} <span style="color:var(--muted)">— ${l.source||'manual'}</span></span>
          <span class="pill">${l.stage}</span>
        </div>`).join("") || `<div class="empty">No leads yet. Add one from the Pipeline tab.</div>`}
    </div>
  `;
}

/* ---------------- PIPELINE ---------------- */
function renderPipeline(){
  const stages = stagesFor(pipelineType);

  // If a listing this filter pointed at got deleted, fall back to "all" rather than showing nothing silently.
  if(pipelineType==="buyer" && buyerViewFilter!=="all" && buyerViewFilter!=="outreach" && !state.listings.some(li=>li.id===buyerViewFilter)){
    buyerViewFilter = "all";
  }

  let leads = state.leads.filter(l=>l.type===pipelineType);
  if(pipelineType==="buyer"){
    if(buyerViewFilter==="outreach") leads = leads.filter(l=> !l.listingId);
    else if(buyerViewFilter!=="all") leads = leads.filter(l=> l.listingId===buyerViewFilter);
  }

  const filterLabel = pipelineType==="buyer"
    ? (buyerViewFilter==="all" ? "All Listings"
      : buyerViewFilter==="outreach" ? "Buyer Outreach Leads"

  return `

function autoCategory(details){
  const d = (details||"").toLowerCase();
  const rules = [
    ["Attorney", ["attorney","lawyer","legal"]],
    ["Lender", ["lender","sba","loan","financing","bank"]],
    ["CPA", ["cpa","accountant","tax","bookkeep"]],
    ["Insurance", ["insurance"]],
    ["Landlord", ["landlord","lease","property manager"]],
    ["Past Client", ["past client","former client","closed deal"]],
  ];
  for(const [cat, words] of rules){
    if(words.some(w=>d.includes(w))) return cat;
  }
  return "General";
}

        <button class="btn small" data-add-contact-note="${c.id}">Add</button>
      </div>
      ${(c.notes||[]).slice().reverse().map(n=>`
        <div class="note-item">
          <div><div>${n.text}</div><div class="meta">${n.author} · ${n.ts}</div></div>
          <div class="item-actions"><button class="mini-x" title="Delete note" data-delete-contact-note="${c.id}:${n.id}">✕</button></div>
        </div>`).join("") || `<div class="empty">No notes yet.</div>`}

      <button class="btn small danger" data-delete-contact="${c.id}" style="margin-top:16px">Delete contact</button>
    </div>
  </div>`;
}

/* ---------------- EVENTS ---------------- */
function bindEvents(){
  root.querySelectorAll("[data-nav]").forEach(el=> el.onclick = ()=>{ view = el.dataset.nav; settingsError=null; settingsSaved=false; render(); });

  const setupBtn = root.querySelector("#btn-setup-submit");
  if(setupBtn) setupBtn.onclick = async ()=>{
    const email = root.querySelector("#setup-email").value.trim();
    const password = root.querySelector("#setup-password").value;
    const confirm = root.querySelector("#setup-password-confirm").value;
    authError = null;
    if(password !== confirm){ authError = "Passwords don't match."; render(); return; }
    try{
      const result = await apiPost("/auth/setup", { email, password });
      authEmail = result.email; authed = true; hasAccount = true;
      render();
      await loadState(); initDragEngine(); render();
    }catch(e){ authError = e.message; render(); }
  };

  const loginBtn = root.querySelector("#btn-login-submit");
  if(loginBtn) loginBtn.onclick = async ()=>{
    const email = root.querySelector("#login-email").value.trim();
    const password = root.querySelector("#login-password").value;
    authError = null;
    try{
      const result = await apiPost("/auth/login", { email, password });
      authEmail = result.email; authed = true;
      render();
      await loadState(); initDragEngine(); render();
    }catch(e){ authError = e.message; render(); }
  };

  const logoutBtn = root.querySelector("#btn-logout");
  if(logoutBtn) logoutBtn.onclick = async ()=>{
    try{ await apiPost("/auth/logout"); }catch(e){}
    authed = false; authEmail = null; view = "dashboard";
    state = { leads:[], listings:[], contacts:[], provisors:[], newsletters:[], tasks:[], loaded:false };
    render();
  };

  const settingsSaveBtn = root.querySelector("#btn-settings-save");
  if(settingsSaveBtn) settingsSaveBtn.onclick = async ()=>{
    const newEmailField = root.querySelector("#settings-email").value.trim();
    const newPassword = root.querySelector("#settings-new-password").value;
    const newPasswordConfirm = root.querySelector("#settings-new-password-confirm").value;
    const currentPassword = root.querySelector("#settings-current-password").value;
    settingsError = null; settingsSaved = false;
    if(!currentPassword){ settingsError = "Enter your current password to save changes."; render(); return; }
    if(newPassword && newPassword !== newPasswordConfirm){ settingsError = "New passwords don't match."; render(); return; }
    const payload = { currentPassword };
    if(newEmailField && newEmailField.toLowerCase() !== (authEmail||"").toLowerCase()) payload.newEmail = newEmailField;
    if(newPassword) payload.newPassword = newPassword;
    if(!payload.newEmail && !payload.newPassword){ settingsError = "Nothing to change."; render(); return; }
    try{
      const result = await apiPatch("/auth/me", payload);
      authEmail = result.email; settingsSaved = true;
      render();
    }catch(e){ settingsError = e.message; render(); }
  };

  root.querySelectorAll("[data-pipe]").forEach(el=> el.onclick = ()=>{ pipelineType = el.dataset.pipe; render(); });

  const buyerViewSelect = root.querySelector("#buyer-view-filter");
  if(buyerViewSelect) buyerViewSelect.onchange = ()=>{ buyerViewFilter = buyerViewSelect.value; render(); };

  root.querySelectorAll("[data-open-lead]").forEach(el=> el.onclick = async (e)=>{
    e.preventDefault();
    if(suppressNextClick){ suppressNextClick = false; return; }
    const id = el.dataset.openLead;
    openContactId=null; openProvisorId=null; openListingId=null;
    try{ await loadLeadDetail(id); }catch(e){ return; }
    openLeadId = id; render();
  });
  root.querySelectorAll("[data-open-contact]").forEach(el=> el.onclick = async ()=>{
    const id = el.dataset.openContact;
    try{ await loadContactDetail(id); }catch(e){ return; }
    openContactId = id; render();
  });
  root.querySelectorAll("[data-open-provisor]").forEach(el=> el.onclick = async ()=>{
    const id = el.dataset.openProvisor;
    try{ await loadProvisorDetail(id); }catch(e){ return; }
    openProvisorId = id; render();
  });
  root.querySelectorAll("[data-quick-stage]").forEach(el=> el.onchange = async ()=>{
    const l = state.leads.find(x=>x.id===el.dataset.quickStage);
    const stage = el.value;
    await apiPatch(`/leads/${l.id}/stage`, { stage, outcome: l.outcome });
    l.stage = stage;
    render();
  });

  root.querySelectorAll("[data-open-listing]").forEach(el=> el.onclick = async ()=>{
    const id = el.dataset.openListing;
    try{ await loadListingDetail(id); }catch(e){ return; }
    openListingId = id; render();
  });

  const btnAddLead = root.querySelector("#btn-add-lead");
  if(btnAddLead) btnAddLead.onclick = ()=>{ showAddLead = true; render(); };
  const btnAddListing = root.querySelector("#btn-add-listing");
  if(btnAddListing) btnAddListing.onclick = ()=>{ showAddListing = true; render(); };
  root.querySelectorAll("[data-open-import]").forEach(el=> el.onclick = ()=>{
    importState = { module: el.dataset.openImport, fileName:"", headers:[], rows:[], mapping:{} };
    render();
  });
  const btnAddContact = root.querySelector("#btn-add-contact");
  if(btnAddContact) btnAddContact.onclick = ()=>{ showAddContact = true; render(); };
  const btnAddProvisor = root.querySelector("#btn-add-provisor");
  if(btnAddProvisor) btnAddProvisor.onclick = ()=>{ showAddProvisor = true; render(); };
  const btnNewNewsletter = root.querySelector("#btn-new-newsletter");
  if(btnNewNewsletter) btnNewNewsletter.onclick = ()=>{ showNewsletterEditor = {id:null, subject:"", body:"", recipientKey:"all_buyers", status:"draft"}; render(); };

  root.querySelectorAll("[data-edit-newsletter]").forEach(el=> el.onclick = ()=>{
    const n = state.newsletters.find(x=>x.id===el.dataset.editNewsletter);
    showNewsletterEditor = Object.assign({}, n);
    render();
  });

  root.querySelectorAll("[data-close]").forEach(el=> el.onclick = ()=> closeAll());
  root.querySelectorAll("[data-close-scrim]").forEach(el=> el.onclick = (e)=>{ if(e.target===el) closeAll(); });
  root.querySelectorAll("[data-stop]").forEach(el=> el.onclick = (e)=> e.stopPropagation());

  const saveLeadBtn = root.querySelector("#btn-save-lead");
  if(saveLeadBtn) saveLeadBtn.onclick = async ()=>{
    const name = root.querySelector("#f-name").value.trim();
    if(!name) return;
    const listingIdField = root.querySelector("#f-listing-id");
    let created;
    try{
      created = await apiPost("/leads", {
        name,
        email: root.querySelector("#f-email").value.trim(),
        phone: root.querySelector("#f-phone").value.trim(),
        type: pipelineType,
        source: root.querySelector("#f-source").value,
        listing_ref: root.querySelector("#f-listing").value.trim(),
        listing_id: listingIdField ? (listingIdField.value || null) : null
      });
    }catch(e){ return; }
    state.leads.push(normalizeLead(created));
    showAddLead = false;
    render();
  };

  const saveListingBtn = root.querySelector("#btn-save-listing");
  if(saveListingBtn) saveListingBtn.onclick = async ()=>{
    const businessName = root.querySelector("#li-name").value.trim();
    if(!businessName) return;
    let created;
    try{
      created = await apiPost("/listings", {
        business_name: businessName,
        industry: root.querySelector("#li-industry").value.trim(),
        asking_price: root.querySelector("#li-price").value.trim(),
        status: root.querySelector("#li-status").value,
        notes: root.querySelector("#li-notes").value.trim()
      });
    }catch(e){ return; }
    state.listings.push(normalizeListing(created));
    showAddListing = false;
    render();
  };

  const saveContactBtn = root.querySelector("#btn-save-contact");
  if(saveContactBtn) saveContactBtn.onclick = async ()=>{
    const name = root.querySelector("#c-name").value.trim();
    if(!name) return;
    const details = root.querySelector("#c-details").value.trim();
    const fileInput = root.querySelector("#c-photo");
    const finish = async (photoDataUrl)=>{
      let created;
      try{
        created = await apiPost("/contacts", {
          name, email: root.querySelector("#c-email").value.trim(),
          phone: root.querySelector("#c-phone").value.trim(), details,
          linkedin: root.querySelector("#c-linkedin").value.trim(),
          category: autoCategory(details), photo_url: photoDataUrl || ""
        });
      }catch(e){ return; }
      state.contacts.push(normalizeContact(created));
      showAddContact = false;
      render();
    };
    if(fileInput.files && fileInput.files[0]){
      const reader = new FileReader();
      reader.onload = ()=> finish(reader.result);
      reader.readAsDataURL(fileInput.files[0]);
    } else finish("");
  };

  const saveProvisorBtn = root.querySelector("#btn-save-provisor");
  if(saveProvisorBtn) saveProvisorBtn.onclick = async ()=>{
    const name = root.querySelector("#p-name").value.trim();
    if(!name) return;
    const specialty = root.querySelector("#p-specialty").value;
    const fileInput = root.querySelector("#p-photo");
    const finish = async (photoDataUrl)=>{
      let created;
      try{
        created = await apiPost("/provisors", {
          name, email: root.querySelector("#p-email").value.trim(),
          phone: root.querySelector("#p-phone").value.trim(), specialty,
          photo_url: photoDataUrl || "", tags: [specialty]
        });
      }catch(e){ return; }
      state.provisors.push(normalizeProvisor(created));
      showAddProvisor = false;
      render();
    };
    if(fileInput.files && fileInput.files[0]){
      const reader = new FileReader();
      reader.onload = ()=> finish(reader.result);
      reader.readAsDataURL(fileInput.files[0]);
    } else finish("");
  };

  const stageSelect = root.querySelector("#stage-select");
  if(stageSelect) stageSelect.onchange = async ()=>{
    const l = state.leads.find(x=>x.id===openLeadId);
    const stage = stageSelect.value;
    try{ await apiPatch(`/leads/${l.id}/stage`, { stage, outcome: l.outcome }); }catch(e){ return; }
    l.stage = stage; render();
  };

  root.querySelectorAll("[data-save-description]").forEach(el=> el.onclick = async ()=>{
    const l = state.leads.find(x=>x.id===el.dataset.saveDescription);
    const description = root.querySelector("#lead-description").value.trim();
    try{ await apiPatch(`/leads/${l.id}/description`, { description }); }catch(e){ return; }
    l.description = description; render();
  });

  const listingStatusSelect = root.querySelector("#listing-status-select");
  if(listingStatusSelect) listingStatusSelect.onchange = async ()=>{
    const li = state.listings.find(x=>x.id===openListingId);
    const status = listingStatusSelect.value;
    try{ await apiPatch(`/listings/${li.id}/status`, { status }); }catch(e){ return; }
    li.status = status; render();
  };
  root.querySelectorAll("[data-delete-listing]").forEach(el=> el.onclick = async ()=>{
    const id = el.dataset.deleteListing;
    try{ await apiDelete(`/listings/${id}`); }catch(e){ return; }
    state.listings = state.listings.filter(x=>x.id!==id);
    state.leads.forEach(l=>{ if(l.listingId===id) l.listingId=""; });
    openListingId = null;
    render();
  });

  root.querySelectorAll("[data-add-link]").forEach(el=> el.onclick = async ()=>{
    const li = state.listings.find(x=>x.id===el.dataset.addLink);
    let url = root.querySelector("#new-link-url").value.trim();
    if(!url) return;
    if(!/^https?:\/\//i.test(url)) url = "https://" + url;
    const label = root.querySelector("#new-link-label").value.trim();
    let created;
    try{ created = await apiPost(`/listings/${li.id}/links`, { label: label || "Link", url }); }catch(e){ return; }
    if(!li.links) li.links = [];
    li.links.push({ id: created.id, label: created.label, url: created.url });
    render();
  });
  root.querySelectorAll("[data-delete-link]").forEach(el=> el.onclick = async ()=>{
    const [listingId, linkId] = el.dataset.deleteLink.split(":");
    try{ await apiDelete(`/listings/${listingId}/links/${linkId}`); }catch(e){ return; }
    const li = state.listings.find(x=>x.id===listingId);
    li.links = (li.links||[]).filter(lk=>lk.id!==linkId);
    render();
  });

  const importFileInput = root.querySelector("#import-file");
  if(importFileInput) importFileInput.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (evt)=>{
      try{
        const data = new Uint8Array(evt.target.result);
        const wb = XLSX.read(data, { type:"array" });
        const firstSheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(firstSheet, { defval:"" });
        const headers = rows.length ? Object.keys(rows[0]) : [];
        const spec = FIELD_SPECS[importState.module];
        importState.fileName = file.name;
        importState.headers = headers;
        importState.rows = rows;
        importState.mapping = autoMapHeaders(headers, spec.fields);
        render();
      }catch(err){
        alert("Could not read that file. Make sure it's a CSV or Excel (.xlsx/.xls) file with a header row.");
      }
    };
    reader.readAsArrayBuffer(file);
  };

  root.querySelectorAll("[data-map-field]").forEach(el=> el.onchange = ()=>{
    importState.mapping[el.dataset.mapField] = el.value;
  });

  const confirmImportBtn = root.querySelector("#btn-confirm-import");
  if(confirmImportBtn) confirmImportBtn.onclick = async ()=>{
    const module = importState.module;
    const rows = importState.rows
      .map(r=> buildRecordFromRow(module, r, importState.mapping))
      .filter(rec=> recordHasAName(module, rec));
    if(!rows.length){ importState = null; render(); return; }

    let result;
    try{
      if(module==="leads-buyer" || module==="leads-seller"){
        result = await apiPost("/import/leads", { rows, type: module==="leads-buyer" ? "buyer" : "seller" });
        state.leads.push(...result.records.map(normalizeLead));
      } else if(module==="listings"){
        result = await apiPost("/import/listings", { rows });
        state.listings.push(...result.records.map(normalizeListing));
      } else if(module==="contacts"){
        result = await apiPost("/import/contacts", { rows });
        state.contacts.push(...result.records.map(normalizeContact));
      } else if(module==="provisors"){
        result = await apiPost("/import/provisors", { rows });
        state.provisors.push(...result.records.map(normalizeProvisor));
      }
    }catch(e){ return; }

    importState = null;
    render();
  };

  root.querySelectorAll("[data-close-won]").forEach(el=> el.onclick = async ()=>{
    const l = state.leads.find(x=>x.id===el.dataset.closeWon);
    try{ await apiPatch(`/leads/${l.id}/stage`, { stage: "Closed", outcome: "won" }); }catch(e){ return; }
    l.stage = "Closed"; l.outcome = "won"; render();
  });
  root.querySelectorAll("[data-close-lost]").forEach(el=> el.onclick = async ()=>{
    const l = state.leads.find(x=>x.id===el.dataset.closeLost);
    try{ await apiPatch(`/leads/${l.id}/stage`, { stage: "Closed", outcome: "lost" }); }catch(e){ return; }
    l.stage = "Closed"; l.outcome = "lost"; render();
  });
  root.querySelectorAll("[data-delete-lead]").forEach(el=> el.onclick = async ()=>{
    const id = el.dataset.deleteLead;
    try{ await apiDelete(`/leads/${id}`); }catch(e){ return; }
    state.leads = state.leads.filter(x=>x.id!==id);
    state.tasks = state.tasks.filter(t=>!(t.recordType==="lead" && t.recordId===id));
    openLeadId = null; render();
  });
  root.querySelectorAll("[data-delete-contact]").forEach(el=> el.onclick = async ()=>{
    const id = el.dataset.deleteContact;
    try{ await apiDelete(`/contacts/${id}`); }catch(e){ return; }
    state.contacts = state.contacts.filter(x=>x.id!==id);
    state.tasks = state.tasks.filter(t=>!(t.recordType==="contact" && t.recordId===id));
    openContactId = null; render();
  });

  root.querySelectorAll("[data-save-linkedin]").forEach(el=> el.onclick = async ()=>{
    const c = state.contacts.find(x=>x.id===el.dataset.saveLinkedin);
    let url = root.querySelector("#contact-linkedin").value.trim();
    if(url && !/^https?:\/\//i.test(url)) url = "https://" + url;
    let updated;
    try{ updated = await apiPatch(`/contacts/${c.id}/linkedin`, { linkedin: url }); }catch(e){ return; }
    c.linkedin = updated.linkedin || ""; render();
  });

  root.querySelectorAll("[data-add-contact-task]").forEach(el=> el.onclick = async ()=>{
    const c = state.contacts.find(x=>x.id===el.dataset.addContactTask);
    const title = root.querySelector("#new-contact-task-title").value.trim();
    const due = root.querySelector("#new-contact-task-due").value;
    if(!title) return;
    let created;
    try{ created = await apiPost("/tasks", { record_type:"contact", record_id:c.id, title, due_date: due||today(), assignee:"Max" }); }catch(e){ return; }
    if(!c.tasks) c.tasks = [];
    const nt = normalizeTask(created);
    c.tasks.push(nt); state.tasks.push(nt);
    render();
  });
  root.querySelectorAll("[data-toggle-contact-task]").forEach(el=> el.onclick = async ()=>{
    const [contactId, taskId] = el.dataset.toggleContactTask.split(":");
    const c = state.contacts.find(x=>x.id===contactId);
    const t = c.tasks.find(x=>x.id===taskId);
    let updated;
    try{ updated = await apiPatch(`/tasks/${taskId}/toggle`); }catch(e){ return; }
    t.status = updated.status;
    const st = state.tasks.find(x=>x.id===taskId); if(st) st.status = updated.status;
    render();
  });
  root.querySelectorAll("[data-delete-contact-task]").forEach(el=> el.onclick = async ()=>{
    const [contactId, taskId] = el.dataset.deleteContactTask.split(":");
    try{ await apiDelete(`/tasks/${taskId}`); }catch(e){ return; }
    const c = state.contacts.find(x=>x.id===contactId);
    c.tasks = c.tasks.filter(t=>t.id!==taskId);
    state.tasks = state.tasks.filter(t=>t.id!==taskId);
    render();
  });

  root.querySelectorAll("[data-add-contact-note]").forEach(el=> el.onclick = async ()=>{
    const c = state.contacts.find(x=>x.id===el.dataset.addContactNote);
    const text = root.querySelector("#new-contact-note-text").value.trim();
    if(!text) return;
    let created;
    try{ created = await apiPost("/notes", { record_type:"contact", record_id:c.id, body:text, author:"Max" }); }catch(e){ return; }
    if(!c.notes) c.notes = [];
    c.notes.push(normalizeNote(created));
    render();
  });
  root.querySelectorAll("[data-delete-contact-note]").forEach(el=> el.onclick = async ()=>{
    const [contactId, noteId] = el.dataset.deleteContactNote.split(":");
    try{ await apiDelete(`/notes/${noteId}`); }catch(e){ return; }
    const c = state.contacts.find(x=>x.id===contactId);
    c.notes = c.notes.filter(n=>n.id!==noteId);
    render();
  });

  root.querySelectorAll("[data-delete-provisor]").forEach(el=> el.onclick = async ()=>{
    const id = el.dataset.deleteProvisor;
    try{ await apiDelete(`/provisors/${id}`); }catch(e){ return; }
    state.provisors = state.provisors.filter(x=>x.id!==id);
    openProvisorId = null; render();
  });

  root.querySelectorAll("[data-add-task]").forEach(el=> el.onclick = async ()=>{
    const l = state.leads.find(x=>x.id===el.dataset.addTask);
    const title = root.querySelector("#new-task-title").value.trim();
    const due = root.querySelector("#new-task-due").value;
    if(!title) return;
    let created;
    try{ created = await apiPost("/tasks", { record_type:"lead", record_id:l.id, title, due_date: due||today(), assignee:"Max" }); }catch(e){ return; }
    const nt = normalizeTask(created);
    l.tasks.push(nt); state.tasks.push(nt);
    render();
  });
  root.querySelectorAll("[data-toggle-task]").forEach(el=> el.onclick = async ()=>{
    const [leadId, taskId] = el.dataset.toggleTask.split(":");
    let updated;
    try{ updated = await apiPatch(`/tasks/${taskId}/toggle`); }catch(e){ return; }
    const st = state.tasks.find(x=>x.id===taskId); if(st) st.status = updated.status;
    const l = state.leads.find(x=>x.id===leadId);
    if(l){ const t = l.tasks.find(x=>x.id===taskId); if(t) t.status = updated.status; }
    render();
  });
  root.querySelectorAll("[data-add-note]").forEach(el=> el.onclick = async ()=>{
    const l = state.leads.find(x=>x.id===el.dataset.addNote);
    const text = root.querySelector("#new-note-text").value.trim();
    if(!text) return;
    let created;
    try{ created = await apiPost("/notes", { record_type:"lead", record_id:l.id, body:text, author:"Max" }); }catch(e){ return; }
    l.notes.push(normalizeNote(created));
    l.lastContactAt = today();
    render();
  });
  root.querySelectorAll("[data-set-contact]").forEach(el=> el.onclick = async ()=>{
    const l = state.leads.find(x=>x.id===el.dataset.setContact);
    try{ await apiPatch(`/leads/${l.id}/contact`); }catch(e){ return; }
    l.lastContactAt = today(); render();
  });

  root.querySelectorAll("[data-add-troika]").forEach(el=> el.onclick = async ()=>{
    const p = state.provisors.find(x=>x.id===el.dataset.addTroika);
    const notes = root.querySelector("#new-troika-notes").value.trim();
    const date = root.querySelector("#new-troika-date").value || today();
    if(!notes) return;
    let created;
    try{ created = await apiPost(`/provisors/${p.id}/troikas`, { event_date: date, notes }); }catch(e){ return; }
    p.troikas.push({ id: created.id, date: d(created.event_date), notes: created.notes });
    p.troikaCount++;
    render();
  });
  root.querySelectorAll("[data-add-conn]").forEach(el=> el.onclick = async ()=>{
    const p = state.provisors.find(x=>x.id===el.dataset.addConn);
    const note = root.querySelector("#new-conn-note").value.trim();
    const direction = root.querySelector("#new-conn-dir").value;
    if(!note) return;
    let created;
    try{ created = await apiPost(`/provisors/${p.id}/connections`, { direction, note, linked_lead_id: null }); }catch(e){ return; }
    p.connections.push({ id: created.id, date: d(created.event_date), direction: created.direction, note: created.note, linkedLeadId: created.linked_lead_id || "" });
    p.connectionCount++;
    render();
  });
  root.querySelectorAll("[data-add-provisor-comment]").forEach(el=> el.onclick = async ()=>{
    const p = state.provisors.find(x=>x.id===el.dataset.addProvisorComment);
    const text = root.querySelector("#new-provisor-comment").value.trim();
    if(!text) return;
    let created;
    try{ created = await apiPost("/notes", { record_type:"provisor", record_id:p.id, body:text, author:"Max" }); }catch(e){ return; }
    p.comments.push(normalizeNote(created));
    p.commentCount++;
    render();
  });

  root.querySelectorAll("[data-delete-task]").forEach(el=> el.onclick = async ()=>{
    const [leadId, taskId] = el.dataset.deleteTask.split(":");
    try{ await apiDelete(`/tasks/${taskId}`); }catch(e){ return; }
    state.tasks = state.tasks.filter(t=>t.id!==taskId);
    const l = state.leads.find(x=>x.id===leadId);
    if(l) l.tasks = l.tasks.filter(t=>t.id!==taskId);
    render();
  });
  root.querySelectorAll("[data-delete-note]").forEach(el=> el.onclick = async ()=>{
    const [leadId, noteId] = el.dataset.deleteNote.split(":");
    try{ await apiDelete(`/notes/${noteId}`); }catch(e){ return; }
    const l = state.leads.find(x=>x.id===leadId);
    l.notes = l.notes.filter(n=>n.id!==noteId);
    render();
  });
  root.querySelectorAll("[data-delete-troika]").forEach(el=> el.onclick = async ()=>{
    const [provisorId, troikaId] = el.dataset.deleteTroika.split(":");
    try{ await apiDelete(`/provisors/${provisorId}/troikas/${troikaId}`); }catch(e){ return; }
    const p = state.provisors.find(x=>x.id===provisorId);
    p.troikas = p.troikas.filter(t=>t.id!==troikaId);
    p.troikaCount--;
    render();
  });
  root.querySelectorAll("[data-delete-conn]").forEach(el=> el.onclick = async ()=>{
    const [provisorId, connId] = el.dataset.deleteConn.split(":");
    try{ await apiDelete(`/provisors/${provisorId}/connections/${connId}`); }catch(e){ return; }
    const p = state.provisors.find(x=>x.id===provisorId);
    p.connections = p.connections.filter(c=>c.id!==connId);
    p.connectionCount--;
    render();
  });
  root.querySelectorAll("[data-delete-provisor-comment]").forEach(el=> el.onclick = async ()=>{
    const [provisorId, commentId] = el.dataset.deleteProvisorComment.split(":");
    try{ await apiDelete(`/notes/${commentId}`); }catch(e){ return; }
    const p = state.provisors.find(x=>x.id===provisorId);
    p.comments = p.comments.filter(c=>c.id!==commentId);
    p.commentCount--;
    render();
  });
  root.querySelectorAll("[data-delete-newsletter]").forEach(el=> el.onclick = async ()=>{
    const id = el.dataset.deleteNewsletter;
    try{ await apiDelete(`/newsletters/${id}`); }catch(e){ return; }
    state.newsletters = state.newsletters.filter(n=>n.id!==id);
    render();
  });

  const saveNlDraft = root.querySelector("#btn-save-newsletter-draft");
  if(saveNlDraft) saveNlDraft.onclick = async ()=> persistNewsletter("draft");
  const sendNl = root.querySelector("#btn-send-newsletter");
  if(sendNl) sendNl.onclick = async ()=> persistNewsletter("send");
}

async function persistNewsletter(action){
  const subject = root.querySelector("#n-subject").value.trim();
  const body = root.querySelector("#n-body").value.trim();
  const recipientKey = root.querySelector("#n-recipients").value;
  const n = showNewsletterEditor;

  if(action==="send" && !confirm("This sends a real email, right now, to everyone in that recipient group using your connected Gmail account. Continue?")){
    return;
  }

  let id = n.id;
  try{
    if(id){
      await apiPatch(`/newsletters/${id}`, { subject, body, recipient_group: recipientKey });
    } else {
      const created = await apiPost("/newsletters", { subject, body, recipient_group: recipientKey });
      id = created.id;
    }
    if(action==="send") await apiPost(`/newsletters/${id}/send`, {});
  }catch(e){ return; }

  const rows = await apiGet("/newsletters");
  state.newsletters = rows.map(normalizeNewsletter);
  showNewsletterEditor = null;
  render();
}

function closeAll(){
  openLeadId = null; openContactId = null; openProvisorId = null; openListingId = null;
  showAddLead = false; showAddListing = false; showAddContact = false; showAddProvisor = false; showNewsletterEditor = null;
  importState = null;
  render();
}

/* ---------------- INIT ---------------- */
let dragEngineStarted = false;
function initDragEngine(){
  if(dragEngineStarted) return; // avoid double-binding if the user logs out and back in
  dragEngineStarted = true;
  document.addEventListener("pointerdown", (e)=>{
    const card = e.target.closest("[data-drag-lead]");
    if(!card) return;
    dragCtx = { leadId: card.dataset.dragLead, startX: e.clientX, startY: e.clientY, sourceEl: card, ghostEl: null, currentCol: null, dragging: false };
  });

  document.addEventListener("pointermove", (e)=>{
    if(!dragCtx) return;
    const dx = e.clientX - dragCtx.startX;
    const dy = e.clientY - dragCtx.startY;

    if(!dragCtx.dragging && Math.hypot(dx, dy) > 6){
      dragCtx.dragging = true;
      suppressNextClick = true;
      dragCtx.sourceEl.classList.add("dragging");
      const rect = dragCtx.sourceEl.getBoundingClientRect();
      const ghost = dragCtx.sourceEl.cloneNode(true);
      ghost.classList.add("drag-ghost");
      ghost.style.width = rect.width + "px";
      ghost.style.left = rect.left + "px";
      ghost.style.top = rect.top + "px";
      document.body.appendChild(ghost);
      dragCtx.ghostEl = ghost;
    }

    if(dragCtx.dragging && dragCtx.ghostEl){
      dragCtx.ghostEl.style.left = (e.clientX - dragCtx.ghostEl.offsetWidth / 2) + "px";
      dragCtx.ghostEl.style.top = (e.clientY - 24) + "px";
      const under = document.elementFromPoint(e.clientX, e.clientY);
      const col = under ? under.closest("[data-stage-drop]") : null;
      if(dragCtx.currentCol && dragCtx.currentCol !== col) dragCtx.currentCol.classList.remove("drag-over");
      if(col) col.classList.add("drag-over");
      dragCtx.currentCol = col;
    }
  });

  document.addEventListener("pointerup", async ()=>{
    if(!dragCtx) return;
    const { dragging, currentCol, leadId, sourceEl, ghostEl } = dragCtx;
    if(sourceEl) sourceEl.classList.remove("dragging");
    if(ghostEl) ghostEl.remove();
    if(currentCol) currentCol.classList.remove("drag-over");

    if(dragging && currentCol){
      const l = state.leads.find(x=>x.id===leadId);
      const newStage = currentCol.dataset.stageDrop;
      if(l && newStage && l.stage !== newStage){
        try{
          await apiPatch(`/leads/${l.id}/stage`, { stage: newStage, outcome: l.outcome });
          l.stage = newStage;
        }catch(e){}
      }
      render();
    }
    dragCtx = null;
  });
}

async function boot(){
  render(); // shows the "Loading…" placeholder while the auth check is in flight
  try{
    const status = await apiGet("/auth/status");
    hasAccount = status.hasAccount;
    if(hasAccount){
      try{
        const me = await apiGet("/auth/me");
        authEmail = me.email; authed = true;
      }catch(e){ authed = false; }
    }
  }catch(e){
    console.error("Could not reach the server", e);
  }
  authChecked = true;
  if(authed){ await loadState(); initDragEngine(); }
  render();
}
boot();

})();
